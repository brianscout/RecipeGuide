<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
<title>Step length measurement</title>
<style>
  /* The cook screen geometry, at device size. Anything changed here changes
     the character ceiling, so this file is the source of that number. */
  :root {
    --ground: #000000;
    --content: #fff6e8;
    --accent: #ffb020;
    --dim: #8c8578;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px; height: 600px; overflow: hidden;
    background: var(--ground); color: var(--content);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 600px; height: 600px;
    display: flex; flex-direction: column; gap: 24px; padding: 40px;
  }
  /* Pinned above the instruction, drawn only when timers are live, but the
     row is reserved either way so starting a timer never reflows the text. */
  .timer { height: 56px; flex: none; font-size: 28px; color: var(--accent); }
  /* The instruction owns everything left over. */
  .instruction {
    flex: 1 1 auto; min-height: 0;
    font-size: 40px; line-height: 1.3; font-weight: 600;
    overflow: hidden;
  }
  .progress { height: 28px; flex: none; font-size: 18px; color: var(--dim); }
  #report { position: fixed; left: 0; top: 0; visibility: hidden; }
</style>
</head>
<body>
  <main class="screen">
    <p class="timer" id="timer">Rest 12:00</p>
    <p class="instruction" id="instruction"></p>
    <p class="progress" id="progress">Step 7 of 12</p>
  </main>
  <pre id="report"></pre>
<script type="module">
// Real recipe prose, in the short imperative register the format asks for.
// Measurement is only honest against text of the kind that will be authored.
const CORPUS = [
  'Heat the oil in a wide pan over medium heat until it shimmers, then add the onion.',
  'Cook the onion with a pinch of salt until soft and translucent, stirring now and then.',
  'Stir in the garlic, tomato paste, and smoked paprika and cook until the paste darkens.',
  'Pour in the stock, scraping the browned bits off the bottom of the pan with a wooden spoon.',
  'Bring to a boil, then lower to the barest simmer and cover with the lid slightly ajar.',
  'Taste and adjust with salt, lemon juice, and a grind of pepper before serving warm.',
  'Whisk the flour, baking powder, and salt together in a wide bowl and set it aside.',
  'Spread the florets on the sheet in a single layer with space between them and roast.',
];
// Widest realistic text: capitalised words are wider than lower case, and a
// ceiling that only holds for narrow prose is not a ceiling.
const WIDE = 'Wholemeal Sourdough Quantities Multiplied Throughout Whichever Warm Kitchen';

const el = document.getElementById('instruction');

function fits(text) {
  el.textContent = text;
  return el.scrollHeight <= el.clientHeight;
}

// Sample strings of exactly n characters, cut on word boundaries where the
// text allows, so the measurement reflects how lines actually wrap.
function samples(n) {
  const out = [];
  for (const seed of [...CORPUS, WIDE]) {
    let s = seed;
    while (s.length < n) s += ' ' + seed;
    out.push(s.slice(0, n).trim().padEnd(n, 'x'));
  }
  return out;
}

function ceiling() {
  let lo = 0, hi = 600;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (samples(mid).every(fits)) lo = mid; else hi = mid - 1;
  }
  return lo;
}

const sizes = [32, 36, 40, 44, 48];
const rows = sizes.map((px) => {
  el.style.fontSize = px + 'px';
  return { px, chars: ceiling() };
});
el.style.fontSize = '40px';

const clientHeight = el.clientHeight;
document.getElementById('report').textContent = JSON.stringify(
  { paneWidth: el.clientWidth, paneHeight: clientHeight, rows }, null, 2);
document.getElementById('report').style.visibility = 'visible';
el.textContent = 'MEASURED';
</script>
</body>
</html>
